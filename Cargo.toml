[workspace]
resolver = "2"
members = ["crates/*"]
# Excluded because Tauri's build system links against system libraries (GTK on
# Linux, WebKit headers) that a plain `cargo check` on the workspace does not
# provision; keep it standalone so workspace checks stay toolchain-agnostic.
exclude = ["apps/desktop/src-tauri"]

[workspace.lints.clippy]
let_underscore_must_use = "warn"
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "warn"
await_holding_lock = "warn"
large_futures = "warn"

# Size-optimized profile for the WebAssembly build of the recurrence engine
# (see scripts/build-recurrence-wasm.sh). Kept separate from `release` so the
# native CLI/backend keep their default optimization settings.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# SQLite is C that nobody steps through, and the tests spend much of their time inside it.
# Optimizing it in debug builds took the workspace tests from 2.1 to 1.7 minutes on an M2, for
# one rebuild of SQLite.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Every other dependency lightly optimized in debug builds; Pikos's own crates stay unoptimized,
# so they still step through cleanly. Debug sqlx, tokio and serde made each test several times
# slower: the workspace's tests went from 139 to 80 CPU-seconds on an M2, the same as at
# opt-level 2, for one rebuild of the dependencies.
[profile.dev.package."*"]
opt-level = 1
