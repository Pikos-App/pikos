# What `cargo audit` may stay quiet about in the desktop lock, which is the one the shipped
# app is built from. The rules for an entry are the workspace's `.cargo/audit.toml`; the
# reachability test here takes the shipped targets:
#
#   cargo tree -i <crate> -e normal,build --target aarch64-apple-darwin   (and x86_64-unknown-linux-gnu)

[advisories]
ignore = [
    # quick-xml 0.37 and 0.39: duplicate-attribute scan is quadratic, and NsReader allocates
    # per namespace declaration. 0.37 comes only through tauri-winrt-notification, which no
    # shipped target compiles. 0.39 is in the macOS binary through Tauri's plist, which reads
    # only the app's own signed Info.plist, so no outside XML reaches it. The sync path's
    # parser is our own dependency, at 0.41. Verified 2026-10-01.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # quinn-proto, rkyv, rsa: in the lockfile, compiled into no shipped target. Verified
    # 2026-10-01.
    "RUSTSEC-2026-0185",
    "RUSTSEC-2026-0235",
    "RUSTSEC-2023-0071",

    # zip 4.6: extraction follows symlinks and keeps SUID bits, and a symlink entry with a large
    # declared size aborts it. Only tauri-plugin-updater uses it, to unpack Windows update
    # archives, and no shipped target compiles it. No stable updater has moved to zip 9 yet.
    # Verified 2026-10-16, and for 0429 on 2026-11-07.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # libsqlite3-sys 0.30: bundled SQLite before 3.54 can return stale page-cache memory when it
    # opens a database beside a crafted -wal file of a different page size. Reachable, unlike the
    # entries above: every target compiles it. Accepted for 0.5.0 by Alex on 2026-11-10, because
    # Pikos opens only its own workspace and the backups it wrote into its own data directory, and
    # a restore deletes the -wal beside the file it puts back, so a crafted pair needs write access
    # to that directory already. The fix is sqlx 0.9, which is a breaking upgrade; drop this entry
    # with it.
    "RUSTSEC-2026-0459",
]
