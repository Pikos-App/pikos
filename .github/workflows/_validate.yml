name: Validate

# Reusable validation gate shared by CI (on PR/main push) and Release (on tag).
# Parallel jobs: verify (typecheck/lint), coverage (unit + thresholds), e2e
# (Playwright, the @mock-only tests), e2e-bridge (every other test, against the
# real writer), rust (fmt/check/clippy/test), wasm (committed
# recurrence pkg matches its crate). Warn-only audit steps stay here so release
# runs emit the same signals CI does.

on:
  workflow_call:

env:
  PNPM_VERSION: 10.30.3
  NODE_VERSION: 24

jobs:
  # Static checks (typecheck + lint + prettier + depcruise) + security audits.
  # Unit tests are NOT run here — they run once in the parallel `coverage` job
  # (same desktop+core suite, with thresholds). Splitting tests out lets the two
  # halves run concurrently instead of stacking ~2.7min + ~2min in one job.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + prettier + depcruise)
        env:
          SKIP_UNIT_TESTS: "1"
        run: pnpm verify

      # The editor bridge's Swift half is generated from
      # packages/editor-mobile/src/protocol.ts so the two ends cannot disagree
      # about a field name or a type. Regenerating here and failing on a diff is
      # what keeps that true — a drifted field would not fail to compile on
      # either side, it would arrive as nil and the editor would quietly stop
      # saving.
      - name: Editor bridge protocol is up to date
        run: |
          pnpm --filter @pikos/editor-mobile gen:swift
          git diff --exit-code -- apps/ios/PikosEditorBridge/Sources \
            || {
              echo "::error::The editor bridge protocol is stale. Run 'pnpm --filter @pikos/editor-mobile gen:swift' and commit the result."
              exit 1
            }

      # The Rust date engine is graded against corpora recorded from the
      # TypeScript parser, which stays the reference until the port replaces it.
      # A change to parser.ts that moves what chrono-node is asked would leave
      # the corpora describing the old behaviour, and the Rust side would keep
      # passing against a stale reference. Regenerating and failing on a diff is
      # what makes that change show up here instead of on a user's phone.
      - name: Date-engine corpora are up to date
        run: |
          pnpm --filter @pikos/core gen:date-corpus
          pnpm --filter @pikos/core gen:date-calls
          git diff --exit-code -- crates/pikos-core/tests/corpus \
            || {
              echo "::error::The date-engine corpora are stale. Run 'pnpm --filter @pikos/core gen:date-corpus && pnpm --filter @pikos/core gen:date-calls' and commit the result — then check crates/pikos-core/tests/date_parity.rs still passes."
              exit 1
            }

      # The bindings drift check above proves the bindings match the Rust. This
      # proves the app matches the bindings — the other half, and the one that
      # cannot be caught here any other way, because building the app needs a
      # Mac. Rename a field in the FFI and the bindings regenerate cleanly while
      # every call site using the old name stays broken until somebody opens
      # Xcode.
      - name: iOS call sites match the generated bindings
        run: pnpm check:ios-ffi

      - name: Source audit (secrets, XSS, SQL, Tauri capabilities)
        run: pnpm audit:source

      - name: JS audit (shipped dependencies)
        run: node scripts/check-js-audit.mjs

  # The single unit-test pass: desktop + core with per-directory coverage
  # thresholds. Runs in parallel with `verify`.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests + coverage (desktop + core, per-directory thresholds)
        run: pnpm --filter @pikos/desktop --filter @pikos/core test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/desktop/coverage/
            packages/core/coverage/
          retention-days: 7

  # The mobile editor driven in a real browser.
  #
  # Not a substitute for M0: typing latency, keyboard behaviour and selection
  # handles are WKWebView questions no desktop browser can answer. What it does
  # cover is the bridge protocol, document fidelity and message validation —
  # which would otherwise only ever be exercised on a device, where a failure
  # costs far more to diagnose.
  #
  # Its own job rather than a step in `verify` (that runner has no browsers) and
  # rather than a step in `e2e` (which is sharded five ways, and this would then
  # run five times). Same container image, for the same reason: pre-baked
  # browsers, no download to stall on.
  editor-e2e:
    name: Mobile Editor E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert Playwright matches the container image
        run: |
          PKG=$(pnpm --filter @pikos/editor-mobile exec playwright --version | awk '{print $NF}')
          if [ "$PKG" != "1.58.2" ]; then
            echo "::error::@pikos/editor-mobile pins @playwright/test $PKG but the container is v1.58.2-noble. Bump both together."
            exit 1
          fi

      - name: Build the editor
        run: pnpm --filter @pikos/editor-mobile build

      - name: Run editor e2e
        run: pnpm --filter @pikos/editor-mobile test:e2e

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: editor-e2e-report
          path: packages/editor-mobile/test-results/
          retention-days: 7

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Run in the official Playwright image: browsers + system deps are pre-baked,
    # so there is no `playwright install` download to stall. (A cold download hung
    # for 30min+ frozen at "100%" once an unrelated lockfile bump busted the
    # browser cache — the download completed but extraction/post-install wedged.)
    # The image tag MUST track @playwright/test — bump both together; the guard
    # step below fails loudly if they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    # Only the tests `e2e-bridge` doesn't take, so one shard covers them. fail-fast:
    # false so one red shard doesn't cancel the others. Tune the shard count by
    # editing this list (the denominator below is derived from it via
    # strategy.job-total).
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert Playwright matches the container image
        run: |
          PKG=$(pnpm --filter @pikos/desktop exec playwright --version | awk '{print $NF}')
          if [ "$PKG" != "1.58.2" ]; then
            echo "::error::@playwright/test is $PKG but the container is pinned to v1.58.2-noble. Update container.image to v$PKG-noble (and this assert) in _build.yml and _validate.yml."
            exit 1
          fi

      # --max-failures=1 stops this shard at its first failure (after the config's
      # retries) instead of grinding through the rest — sibling shards still run,
      # so we lose no cross-shard signal but skip the wasted minutes on a red shard.
      # Every other test runs in `e2e-bridge` instead, not in both.
      - name: E2E tests (Playwright)
        run: pnpm --filter @pikos/desktop exec playwright test --project=e2e --grep @mock-only --shard=${{ matrix.shard }}/${{ strategy.job-total }} --max-failures=1

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/desktop/blob-report/
          retention-days: 7

  # Merge the per-shard blob reports into a single HTML report. Runs even when a
  # shard fails (so the report covers the failures) but never masks them — the
  # e2e job's own conclusion is what gates the run.
  e2e-report:
    name: E2E Report
    if: ${{ !cancelled() }}
    needs: [e2e, e2e-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: apps/desktop/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: pnpm --filter @pikos/desktop exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  # The root Cargo workspace (crates/*) — pikos-db, pikos-cli, pikos-core.
  #
  # Separate from the `rust` job below because that one runs inside
  # apps/desktop/src-tauri, which Cargo.toml deliberately *excludes* from the
  # root workspace (Tauri links GTK/WebKit system libraries). The consequence
  # went unnoticed: `cargo test --all` in src-tauri resolves to src-tauri alone,
  # so until this job existed the shared data layer's tests never ran in CI
  # despite being the single writer behind both the app and the CLI.
  #
  # Its one system dependency is the keychain's dbus, which pikos-ffi reaches
  # through calendar sync. No GTK or WebKit, which keeps it fast enough for every push.
  rust-workspace:
    name: Rust Check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cargo fmt --check
        run: cargo fmt --all --check

      - name: Cargo check (zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --quiet

      # The generator is TypeScript — it runs the reference implementation —
      # so this job needs Node as well as Rust. Set up after the Rust checks so
      # a formatting or clippy failure surfaces without waiting on an install.
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The committed fuzz corpus is a sample. This searches wider on every CI
      # run, with a seed derived from the run so successive runs explore
      # different ground — which is the point: the first 20,000-line sweep found
      # five divergence classes the 317-input corpus never reached, and a second
      # seed found a sixth the first had missed.
      - name: Wider differential fuzz against the TypeScript parser
        run: |
          FUZZ_CASES=8000 FUZZ_SEED=${{ github.run_number }} \
            FUZZ_OUT=/tmp/fuzz-wide.json pnpm --filter @pikos/core gen:fuzz
          PIKOS_FUZZ_CORPUS=/tmp/fuzz-wide.json PIKOS_FUZZ_FAILURES=/tmp/fuzz-failures.json \
            cargo test --release -p pikos-core --test quick_add_fuzz

      # No recurrence step here on purpose. It fuzzed pikos-core's own RRULE
      # engine against rrule.js through packages/core; that engine is gone and
      # TypeScript now calls crates/pikos-recurrence through wasm, so the two
      # sides are one implementation. Its grading is
      # crates/pikos-recurrence/tests/rrule_js_goldens.rs, which the workspace
      # cargo test above already runs. See crates/pikos-core/tests/parity.rs.

      - name: Wider differential fuzz against the TypeScript calendar layout
        run: |
          FUZZ_CASES=10000 FUZZ_SEED=${{ github.run_number }} \
            FUZZ_OUT=/tmp/calendar-wide.json pnpm --filter @pikos/desktop gen:fuzz-calendar
          PIKOS_CALENDAR_FUZZ=/tmp/calendar-wide.json \
            cargo test --release -p pikos-core --test calendar_fuzz

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: fuzz-failures
          path: /tmp/fuzz-failures.json
          retention-days: 7

      # The Swift bindings are generated from the Rust FFI surface and
      # committed so the API is reviewable in a pull request. Regenerating here
      # and failing on a diff is what stops the Rust surface changing while the
      # committed Swift silently describes the old one — a mismatch that would
      # otherwise surface as a link error on somebody's Mac, far from the cause.
      # uniffi-bindgen reads the compiled cdylib's metadata, so this needs no
      # Apple toolchain.
      - name: Swift bindings are up to date
        run: |
          bash scripts/gen-swift-bindings.sh
          git diff --exit-code -- apps/ios/PikosCore/Sources apps/ios/PikosCore/generated \
            || {
              echo "::error::Swift bindings are stale. Run scripts/gen-swift-bindings.sh and commit the result."
              exit 1
            }
  # Every test not tagged @mock-only, against the real Rust writer. Same
  # container as `e2e`, so the browser is the one the mock lane uses; the bridge
  # links the app crate, so the container also needs Rust and the Tauri build
  # libraries the `rust` job installs. Most of the suite is here, so the shards are.
  e2e-bridge:
    name: E2E Tests, real writer (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config tzdata sqlite3 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Built here so the Playwright web-server timeout never covers a cold compile.
      - name: Build the e2e bridge
        working-directory: apps/desktop/src-tauri
        run: cargo build --features e2e-bridge --bin pikos-e2e-bridge

      # The writer reads its zone from /etc/localtime on Linux, not TZ; the bridge
      # refuses to start if the two disagree. Must match ZONE in the bridge config.
      - name: Pin the container's zone to the lane's
        run: ln -sf /usr/share/zoneinfo/America/New_York /etc/localtime

      - name: E2E tests against the real writer (Playwright)
        run: pnpm --filter @pikos/desktop test:e2e:bridge --shard=${{ matrix.shard }}/${{ strategy.job-total }} --max-failures=1

      # Merged with the mock lane's shards by `e2e-report`.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-bridge-${{ matrix.shard }}
          path: apps/desktop/blob-report/
          retention-days: 7

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libdbus-1-dev backs the Linux keychain (keyring's sync-secret-service); without it
          # pikos-calendar-sync fails at link time.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev

      # Two Cargo trees, both gated. The root workspace is `crates/*` and it
      # *excludes* apps/desktop/src-tauri, so `--all` inside src-tauri resolves to
      # that one standalone crate — running only there left pikos-db, -cli,
      # -calendar-sync and -recurrence with no CI coverage at all. Mirrors the
      # split .husky/pre-push already runs.
      - name: Cargo fmt --check (workspace)
        working-directory: .
        run: cargo fmt --all --check

      - name: Cargo clippy (workspace, zero warnings)
        working-directory: .
        run: cargo clippy --workspace --all-targets -- -D warnings

      # pikos-cli's `add` tests drive the real NLP parser through the
      # @pikos/bridge bundle and silently skip themselves when it is absent —
      # so without this build step the CLI's whole parser surface passes
      # vacuously here.
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Build the parser bridge
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pikos/bridge build

      - name: Cargo test (workspace)
        working-directory: .
        run: cargo test --workspace --quiet

      # The one test that asks the OS for its keychain. Every other keychain test injects a map,
      # so a build naming no backend for this platform passes all of them and then forgets every
      # password at runtime, which is what 0.4.0-beta.3 did.
      - name: Linux keyring round-trip
        working-directory: .
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools
          bash scripts/linux-keyring-check.sh

      # The connect itself, against a CalDAV server that answers and a Secret Service
      # that persists — the two things every other test of this path fakes. It is not
      # the manual Linux matrix, which needs a desktop session, but it is the row
      # underneath it: connecting works and the password is still there afterwards.
      - name: Linux CalDAV connect round-trip
        working-directory: .
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools radicale
          bash scripts/linux-sync-check.sh

      - name: Cargo fmt --check (desktop crate)
        run: cargo fmt --check

      - name: Cargo check (desktop crate, zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check

      - name: Cargo clippy (desktop crate, zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test (desktop crate)
        run: cargo test --all --quiet

      # Cached binary so we don't reinstall every run.
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # Blocking. This tree is Pikos's own crates and the dependencies they chose,
      # so an advisory here is a decision someone made. What it may stay quiet
      # about, and why, is `.cargo/audit.toml`.
      - name: Cargo audit
        working-directory: .
        run: cargo audit

      # The desktop crate is outside the workspace and keeps its own lock, the one the
      # shipped binary is built from, with its own accepted list beside it.
      - name: Cargo audit (desktop)
        run: cargo audit

  # packages/core/src/generated mirrors pikos-db's wire structs and is committed, so
  # it drifts the moment a Rust field changes without a regeneration — with every
  # other gate still green, since both sides typecheck fine in isolation. Same
  # artifact-freshness shape as the wasm job below.
  bindings:
    name: Bindings Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the committed bindings
        run: scripts/gen-ts-bindings.sh

      - name: Fail if the bindings are stale
        run: |
          if [ -n "$(git status --porcelain packages/core/src/generated)" ]; then
            echo "::error::packages/core/src/generated does not match pikos-db. Run scripts/gen-ts-bindings.sh and commit the result."
            git --no-pager diff -- packages/core/src/generated
            exit 1
          fi

  # packages/recurrence-wasm/pkg is a committed build artifact, so it can drift
  # from the crate it was generated from with every other gate still green: the
  # Rust tests cover the crate, the JS tests cover the stale pkg. Rebuilding and
  # diffing is what ties them together. The script compiles inside a pinned
  # container so this runner and a contributor's Mac emit the same bytes; rustc's
  # wasm output is host-dependent, and no flag pins that (see the script).
  wasm:
    name: Wasm Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No toolchain setup: the script compiles inside its own pinned image, and
      # a runner-installed rustc or wasm-bindgen would not be the one it uses.
      - name: Rebuild the committed pkg
        run: scripts/build-recurrence-wasm.sh

      - name: Fail if pkg is stale
        run: |
          if [ -n "$(git status --porcelain packages/recurrence-wasm/pkg)" ]; then
            echo "::error::packages/recurrence-wasm/pkg does not match the recurrence crate. Run scripts/build-recurrence-wasm.sh and commit the result."
            git status --porcelain packages/recurrence-wasm/pkg
            exit 1
          fi
          echo "✓ pkg matches the crate"
