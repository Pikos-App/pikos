name: CI

# Every PR runs, a docs-only one included, so "CI result" always reports and main can require
# it. Docs-only changes still skip the code gates: the `changes` job decides that per job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub drops a cache nobody has read for seven days, and a run with none takes about 30
  # minutes instead of 12. main can go that long without a push, so this runs twice a week to
  # keep main's caches warm for the next push and every branch that reads them. It also catches
  # a new stable Rust's lints before a push does.
  schedule:
    - cron: '41 9 * * 1,4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.30.3

jobs:
  # ── What changed ───────────────────────────────────────────────────────────
  # The iOS job is skipped by path. It is the one macOS runner and often the longest job,
  # and most changes never reach the phone: a desktop screen, the site, a script.
  #
  # `code` is false when the whole change is docs, and for a push that changed only docs on top
  # of a head whose CI passed, since that head's result still holds. `audits` is true only when a
  # lockfile changed, and on the schedule.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # A pull request's changed files come from the API, and the last head's result from runs.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'schedule' || (steps.code.outputs.code == 'true' && steps.docs.outputs.code != 'false') }}
      ios: ${{ github.event_name == 'schedule' || steps.filter.outputs.ios == 'true' }}
      audits: ${{ github.event_name == 'schedule' || steps.filter.outputs.locks == 'true' }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'schedule'

      # Anything that fails to resolve, like a force-push or a missing run, leaves `code` true.
      - name: Docs-only push on a passing head?
        id: docs
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE" "$AFTER" || exit 0
          changed=$(git diff --name-only "$BEFORE" "$AFTER") || exit 0
          # The site builds its release notes and posts from markdown, so those count as code.
          if [ -z "$changed" ] || grep -qvE '(\.md|^LICENSE)$' <<<"$changed" \
            || grep -q '^apps/marketing/' <<<"$changed"; then
            exit 0
          fi
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$BEFORE" \
            --event pull_request --json conclusion --jq '.[0].conclusion // ""') || exit 0
          if [ "$prev" = success ]; then
            echo "Only docs changed since $BEFORE, whose CI passed. Skipping the code gates."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # Everything the phone app is built from. A path missing here is a phone break CI never
      # sees, so in doubt, add it.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule'
        with:
          filters: |
            ios:
              - 'apps/ios/**'
              - 'apps/apple/**'
              - 'crates/**'
              - 'packages/core/**'
              - 'packages/editor-mobile/**'
              - 'packages/editor-schema/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/build-ios-framework.sh'
              - 'scripts/build-editor-bundle.sh'
              - 'scripts/gen-swift-bindings.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_ios.yml'
            locks:
              - 'Cargo.lock'
              - 'pnpm-lock.yaml'
              - 'apps/desktop/src-tauri/Cargo.lock'

      # A file counts as code unless it is markdown or the licence. Its own step, because
      # `every` would turn the OR lists above into AND lists.
      - uses: dorny/paths-filter@v3
        id: code
        if: github.event_name != 'schedule'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'

  # ── Validation ─────────────────────────────────────────────────────────────
  # verify + e2e + rust live in _validate.yml so release.yml can reuse them.
  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_validate.yml
    with:
      audits: ${{ needs.changes.outputs.audits == 'true' }}

  # ── iOS ────────────────────────────────────────────────────────────────────
  # The only macOS runner in the repo, so it is its own workflow rather than a
  # job in _validate.yml — see the note at the top of _ios.yml. The UI flows are
  # off here: they need a simulator to boot, and the build plus the package
  # suites catch most of what breaks for a fraction of the wall clock. Turn them
  # on for a release, or when a screen is what changed.
  ios:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/_ios.yml

  # ── Build ──────────────────────────────────────────────────────────────────
  # Prod-bundle gate: bundle size, the packaged-CSP smoke test, and perf.
  # Extracted into _build.yml so release.yml runs the same gate on the tag.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml

  # ── Result ─────────────────────────────────────────────────────────────────
  # The one check main requires. A skipped reusable workflow reports under its caller's name
  # alone, so requiring "validate / Verify" would wait forever on a docs-only PR; this job always
  # runs, passes when every gate passed or was skipped, and fails otherwise.
  result:
    name: CI result
    if: always()
    needs: [changes, validate, ios, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gates: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a gate ended $r"; exit 1 ;; esac
          done

  # A red scheduled run has nobody watching it, so it opens an issue, or comments on the one
  # already open, with the run's link and the jobs that failed.
  file-scheduled-failure:
    name: File a scheduled failure
    if: always() && github.event_name == 'schedule' && needs.result.result == 'failure'
    needs: [result]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name' || true)
          body=$(printf 'The scheduled CI run on `main` failed: %s\n\n%s\n\nA new seed, a new advisory and a flaky test all land here. Triage each into the backlog.\n' "$RUN_URL" "${failed:-- (no job reported failure)}")
          gh label create ci-scheduled --color B60205 --description "A scheduled CI run failed" --force
          open=$(gh issue list --label ci-scheduled --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label ci-scheduled --title "Scheduled CI failed" --body "$body"
          fi
