# The Homebrew tap is a second repository with no CI of its own, and it breaks in ways nobody
# sees: a release ships and the cask keeps naming the version before it, or Homebrew deprecates a
# stanza the tap still uses. Both surface as a failed `brew install` for somebody else.
#
# Weekly, and on demand. Installs nothing: it audits, and fetches to prove the URLs and checksums
# resolve.
name: Homebrew tap

# Also on publish, which is the moment the tap goes stale: it turns "found a week later by the
# Monday run" into "found now", and it stays red until the tap names the release that just shipped.
# That red is the reminder, and bumping the tap is the last step of shipping rather than a chore.
on:
  release:
    types: [published]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  tap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/brew-check.sh
