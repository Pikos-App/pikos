name: iOS

# The Swift half, compiled and run.
#
# Until this existed, nothing anywhere built `apps/ios`. CI checked that the
# generated bindings were not *stale* — a real check, and a different one — so
# thousands of lines of Swift accumulated that no machine had ever type-checked.
# The most valuable step here is therefore the plain build: it turns "we will
# find out on somebody's laptop, eventually" into a failure on the push that
# caused it.
#
# Its own workflow rather than another job in _validate.yml, because this is the
# only thing in the repo needing a macOS runner. Those bill at ten times a Linux
# minute, so being able to see, schedule and skip it on its own is worth the
# extra file.

on:
  workflow_call:
    inputs:
      run-ui-tests:
        description: >-
          Boot a simulator and run the tier-1 XCUITest flows. Off by default:
          the build and the package suites catch most of what breaks, in a
          fraction of the time a simulator takes to come up.
        type: boolean
        default: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.30.3
  SIMULATOR: iPhone 16

jobs:
  ios:
    name: Build + test
    runs-on: macos-15
    timeout-minutes: 60
    # Pinned, so a runner image rolling its default Xcode is a deliberate bump here. The image's
    # default is 16.4, whose Swift 6.1 rejects concurrency the 26 SDKs mark Sendable; 26.3 is the
    # newest it carries.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep -i '^Xcode' || true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compiler comes from rust-toolchain.toml; build-ios-framework.sh adds the targets.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Read the Rust toolchain
        id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # The framework is a release build of the Rust core, so a run that changed no Rust takes it
      # from here. Skipping the build also skips its regeneration of the Swift bindings, so the
      # committed ones stand in, and the workspace job proves those are current. This file is in
      # the key because the slices and the Xcode it builds with are set here.
      - name: Restore PikosFFI.xcframework
        id: ffi
        uses: actions/cache@v5
        with:
          path: apps/ios/PikosCore/Frameworks/PikosFFI.xcframework
          key: ios-ffi-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'scripts/build-ios-framework.sh', 'scripts/gen-swift-bindings.sh', '.github/workflows/_ios.yml') }}

      - name: Cache cargo
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ios-cargo-

      - name: Install the build tools
        run: brew install xcodegen xcbeautify

      # ── The two artifacts the Xcode project cannot build for itself ────────
      #
      # Both are gitignored: a multi-megabyte binary and a bundled webview
      # payload have no business in git. That makes building them the first step
      # of any checkout, here as on a laptop.

      - name: Build the editor bundle
        run: bash scripts/build-editor-bundle.sh

      # Also builds the macOS slice, which is what lets the package suites
      # below run on the host instead of in a simulator. Only this runner's
      # slices: the Apple-silicon simulator the app is built for and the macOS
      # host, since each slice is a full release build of the Rust core. The
      # device slice is TestFlight's to build.
      - name: Build PikosFFI.xcframework
        if: steps.ffi.outputs.cache-hit != 'true'
        env:
          PIKOS_IOS_TARGETS: aarch64-apple-ios-sim aarch64-apple-darwin
        run: bash scripts/build-ios-framework.sh

      # ── The fast tests ────────────────────────────────────────────────────
      #
      # First, and on the host. `PikosSupport` needs no simulator at all and
      # `PikosCore`'s boundary tests need only the macOS slice, so both answer
      # in seconds — and a failure names a function rather than a screen.

      - name: Test PikosCore and PikosSupport
        run: swift test --package-path apps/ios/PikosCore

      - name: Test PikosEditorBridge
        run: swift test --package-path apps/ios/PikosEditorBridge

      - name: Test PikosSync
        run: swift test --package-path apps/apple/PikosSync

      # ── Compile the app ───────────────────────────────────────────────────
      #
      # The step this workflow exists for. Everything under `apps/ios/Pikos` —
      # every screen, every store — is compiled here and nowhere else.
      #
      # `CODE_SIGNING_ALLOWED=NO` because a simulator build needs no identity,
      # and requiring one would make this a question about certificates rather
      # than about the code. The app reads its workspace from an environment
      # variable under test (`WorkspaceLocation.workspaceOverrideKey`), so it
      # never needs the App Group entitlement a signed build would carry.

      - name: Generate the Xcode project
        run: cd apps/ios/Pikos && xcodegen generate

      # Some runners start with no simulator listed while the runtimes still mount, and a build
      # aimed at one by name then fails with "Unable to find a device". Wait for one, preferring
      # $SIMULATOR, and aim at it by id.
      - name: Pick a simulator
        run: |
          for _ in $(seq 1 24); do
            devices=$(xcrun simctl list devices available -j)
            id=$(jq -r --arg n "$SIMULATOR" '[.devices[][] | select(.name == $n)][0].udid // empty' <<<"$devices")
            [ -n "$id" ] || id=$(jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last.udid // empty' <<<"$devices")
            [ -n "$id" ] && break
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "::error::No iPhone simulator appeared on this runner within two minutes."
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl list devices available | grep "$id"
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/ios/Pikos/Pikos.xcodeproj \
            -scheme Pikos \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # On every push, unlike the flows below: the phone's half of the desktop's count gate, reads
      # and rows rather than time. One simulator boot and one test, on the 20,000-page template the
      # desktop's `@large` tests use.
      - name: Build the 20,000-page workspace
        run: |
          cargo run --release --quiet -p pikos-cli -- --db "$RUNNER_TEMP/pikos-large.sqlite" \
            stress seed --pages 20000 --large-pages 0 --shape mixed --json

      - name: Read counts at 20,000 pages
        env:
          TEST_RUNNER_PIKOS_LARGE_TEMPLATE: ${{ runner.temp }}/pikos-large.sqlite
        run: |
          set -o pipefail
          xcodebuild test \
            -project apps/ios/Pikos/Pikos.xcodeproj \
            -scheme Pikos \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -only-testing:PikosUITests/CountTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Tier-1 UI flows
        if: inputs.run-ui-tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project apps/ios/Pikos/Pikos.xcodeproj \
            -scheme Pikos \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:PikosUITests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # A UI test that fails on a runner nobody can attach to is only as useful
      # as what it leaves behind.
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
