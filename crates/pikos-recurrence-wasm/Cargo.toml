[package]
name = "pikos-recurrence-wasm"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "wasm-bindgen bindings for pikos-recurrence — built into the @pikos/recurrence-wasm npm package by scripts/build-recurrence-wasm.sh."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pikos-recurrence = { path = "../pikos-recurrence" }
# Pinned exactly: the generated glue must match the wasm-bindgen CLI version
# used by scripts/build-recurrence-wasm.sh.
wasm-bindgen = "=0.2.104"
serde_json = "1"
