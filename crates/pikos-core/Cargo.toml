[package]
name = "pikos-core"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Pikos portable domain logic — local wall-clock dates and recurrence. Ported from @pikos/core; graded against a golden corpus generated from the TypeScript reference."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
